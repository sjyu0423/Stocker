[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "marketmind"
version = "0.1.0"
description = "MarketMind market intelligence product foundation"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "alembic>=1.14,<2",
  "celery[redis]>=5.4,<6",
  "fastapi>=0.115,<1",
  "psycopg[binary]>=3.2,<4",
  "pydantic-settings>=2.6,<3",
  "sqlalchemy>=2.0.36,<3",
  "uvicorn[standard]>=0.32,<1",
]

[dependency-groups]
dev = [
  "httpx>=0.28,<1",
  "mypy>=1.13,<2",
  "pytest>=8.3,<9",
  "pytest-cov>=6,<7",
  "ruff>=0.8,<1",
]

[tool.hatch.build.targets.wheel]
packages = ["apps/backend/src/marketmind"]

[tool.pytest.ini_options]
addopts = "--strict-markers --strict-config -q"
testpaths = ["tests"]
markers = [
  "postgresql: requires TEST_POSTGRES_URL and exercises PostgreSQL-specific behavior",
]

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["apps/backend/src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
mypy_path = "apps/backend/src"

[[tool.mypy.overrides]]
module = ["celery.*"]
ignore_missing_imports = true

