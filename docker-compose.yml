services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: marketmind
      POSTGRES_USER: marketmind
      POSTGRES_PASSWORD: marketmind
    ports: ["5432:5432"]
    volumes: ["postgres_data:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U marketmind"]
      interval: 5s
      timeout: 5s
      retries: 10
  redis:
    image: redis:7.4-alpine
    ports: ["6379:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10
  api:
    build:
      context: .
      dockerfile: apps/backend/Dockerfile
    command: uvicorn marketmind.api.main:app --host 0.0.0.0 --port 8000 --reload
    env_file: [.env]
    environment:
      PYTHONPATH: /app/apps/backend/src
    volumes: ["./apps/backend:/app/apps/backend", "./fixtures:/app/fixtures"]
    ports: ["8000:8000"]
    depends_on:
      postgres: {condition: service_healthy}
      redis: {condition: service_healthy}
  worker:
    build:
      context: .
      dockerfile: apps/backend/Dockerfile
    command: celery -A marketmind.worker.celery_app:celery_app worker --loglevel=INFO
    env_file: [.env]
    environment:
      PYTHONPATH: /app/apps/backend/src
    depends_on:
      postgres: {condition: service_healthy}
      redis: {condition: service_healthy}
  frontend:
    build: apps/frontend
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8000/api/v1
    ports: ["3000:3000"]
    depends_on: [api]
volumes:
  postgres_data:

